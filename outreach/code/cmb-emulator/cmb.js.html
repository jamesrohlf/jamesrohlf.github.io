  <script>
  (function () {
    'use strict';
    var EMU = __PAYLOAD__;
    var PLANCK = __PLANCK__;

    function f32(b64) {
      var s = atob(b64), n = s.length, u = new Uint8Array(n), i;
      for (i = 0; i < n; i++) u[i] = s.charCodeAt(i);
      return new Float32Array(u.buffer);
    }
    var NODES = f32(EMU.nodes), BASIS = f32(EMU.basis),
        MEAN0 = f32(EMU.mean0), MEAN1 = f32(EMU.mean1), MEAN2 = f32(EMU.mean2),
        W1 = f32(EMU.W1), B1 = f32(EMU.b1), W2 = f32(EMU.W2), B2 = f32(EMU.b2),
        W3 = f32(EMU.W3), B3 = f32(EMU.b3);
    var K = EMU.K, H = EMU.H, NL = EMU.nl, CS = EMU.cs;
    var S0 = EMU.s0, S1 = EMU.s1, S2 = EMU.s2;

    var PAR = [
      { key:'ombh2', label:'Ωbh²',        html:'&Omega;<sub>b</sub>h&sup2;',
        hint:'baryon density — odd vs even peak heights', dp:5, step:0.00001, sig:0.00015 },
      { key:'omch2', label:'Ωch²',        html:'&Omega;<sub>c</sub>h&sup2;',
        hint:'cold dark matter — first peak height',      dp:4, step:0.00008, sig:0.0012 },
      { key:'th100', label:'100θ*',                 html:'100&thinsp;&theta;<sub>&lowast;</sub>',
        hint:'angular size of the sound horizon — slides the peaks in ℓ', dp:5, step:0.00002, sig:0.00031 },
      { key:'tau',   label:'τ',                     html:'&tau;',
        hint:'reionization — peaks vs the low-ℓ plateau', dp:4, step:0.0004, sig:0.0073 },
      { key:'logAs', label:'ln(10¹⁰Aₛ)',  html:'ln(10<sup>10</sup>A<sub>s</sub>)',
        hint:'primordial amplitude — overall scale',      dp:4, step:0.001, sig:0.014 },
      { key:'ns',    label:'nₛ',                    html:'n<sub>s</sub>',
        hint:'tilt — pivots large against small scales',  dp:4, step:0.0003, sig:0.0042 }
    ];
    var LO = EMU.lo, HI = EMU.hi, FID = EMU.fid;
    var cur = FID.slice();

    // Sliders run +-10 Planck sigma, not the full trained box: with the residual
    // panel doing the work, a wider sweep only buys unphysical territory. LO/HI
    // above remain the emulator's normalisation and are deliberately unchanged.
    // tau is the exception -- tau - 10 sigma is negative, so it clamps to the
    // trained range, -6.1 to +9.0 sigma.
    var SPAN = 10;                 // Infinity when "full range" is ticked
    function smin(i) { return Math.max(LO[i], FID[i] - SPAN * PAR[i].sig); }
    function smax(i) { return Math.min(HI[i], FID[i] + SPAN * PAR[i].sig); }
    // Derive the step rather than hard-coding it, so that Planck's value sits
    // exactly on a notch in BOTH modes: reset then restores it exactly and the
    // slider position always agrees with the readout.
    function stepFor(i) {
      var a = smin(i), b = smax(i), want = (b - a) / 300;
      var k = Math.max(1, Math.round((FID[i] - a) / want));
      return (FID[i] - a) / k;
    }
    function applyRange() {
      PAR.forEach(function (p, i) {
        var el = document.getElementById('k' + i);
        var a = smin(i), b = smax(i);
        cur[i] = Math.max(a, Math.min(b, cur[i]));   // keep the current model in range
        el.min = a; el.max = b; el.step = stepFor(i);
      });
    }

    // ---- emulator ---------------------------------------------------------
    // One network, one PCA basis, three spectra. TT and EE come back through a
    // logarithm (both positive definite); TE is carried linearly because it
    // changes sign about nineteen hundred times.
    var h1 = new Float32Array(H), h2 = new Float32Array(H), co = new Float32Array(K);
    var OTT = new Float32Array(NL), OEE = new Float32Array(NL), OTE = new Float32Array(NL);
    function spectra(p) {
      var i, jj, s, z = new Float32Array(6);
      for (i = 0; i < 6; i++) z[i] = 2 * (p[i] - LO[i]) / (HI[i] - LO[i]) - 1;
      for (jj = 0; jj < H; jj++) { s = B1[jj]; for (i = 0; i < 6; i++) s += z[i]*W1[i*H+jj];
                                   h1[jj] = Math.tanh(s); }
      for (jj = 0; jj < H; jj++) { s = B2[jj]; for (i = 0; i < H; i++) s += h1[i]*W2[i*H+jj];
                                   h2[jj] = Math.tanh(s); }
      for (jj = 0; jj < K; jj++) { s = B3[jj]; for (i = 0; i < H; i++) s += h2[i]*W3[i*K+jj];
                                   co[jj] = s * CS; }
      var NB = 3 * NL;
      for (i = 0; i < NL; i++) {
        var a = 0, b = 0, c = 0;
        for (jj = 0; jj < K; jj++) {
          var base = jj * NB, w = co[jj];
          a += w * BASIS[base + i];
          b += w * BASIS[base + NL + i];
          c += w * BASIS[base + 2*NL + i];
        }
        OTT[i] = Math.exp(a * S0 + MEAN0[i]);
        OEE[i] = Math.exp(b * S1 + MEAN1[i]);
        OTE[i] =          c * S2 + MEAN2[i];
      }
      return { TT:OTT, EE:OEE, TE:OTE };
    }
    function atL(sp, l) {                      // linear interp onto a real l
      if (l <= NODES[0]) return sp[0];
      if (l >= NODES[NL-1]) return sp[NL-1];
      var a = 0, b = NL - 1, m;
      while (b - a > 1) { m = (a + b) >> 1; if (NODES[m] <= l) a = m; else b = m; }
      var t = (l - NODES[a]) / (NODES[b] - NODES[a]);
      return sp[a] + t * (sp[b] - sp[a]);
    }

    // ---- geometry: Planck's own convention, log to l=30 then linear -------
    var NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('plot');
    var X0 = 74, X1 = 884, Y0 = 20, SPLIT = 30, FRAC = 0.20;
    var XB = X0 + (X1 - X0) * FRAC;
    // Y1 moves: with the residual strip shown the main panel gives up its lower
    // third, and the shared multipole axis is drawn under the strip instead.
    var SHOWR = true, PANELS = [], TOTH = 520;
    // Which spectra are on, in the order Planck plots them.
    function activeSpectra() {
      return ['TT','TE','EE'].filter(function (k) {
        return document.getElementById('sp-' + k).checked;
      });
    }
    // Lay the panels out top to bottom. One panel gets the full height; more
    // than one and they share, so three plus sliders still fit a screen.
    function layout() {
      SHOWR = document.getElementById('showresid').checked;
      var ks = activeSpectra();
      if (!ks.length) { document.getElementById('sp-TT').checked = true; ks = ['TT']; }
      var n = ks.length;
      var plotH = n === 1 ? (SHOWR ? 316 : 388) : (n === 2 ? (SHOWR ? 186 : 236) : (SHOWR ? 132 : 168));
      var resH  = SHOWR ? (n === 1 ? 90 : (n === 2 ? 66 : 52)) : 0;
      var gap   = 26, top = 20;
      PANELS = ks.map(function (k) {
        var p = { key:k, y0:top, y1:top + plotH,
                  r0:top + plotH + 14, r1:top + plotH + 14 + resH };
        top = (SHOWR ? p.r1 : p.y1) + gap;
        return p;
      });
      TOTH = top + 34;
      svg.setAttribute('viewBox', '0 0 900 ' + TOTH);
    }
    function xpos(l) {
      if (l <= SPLIT) return X0 + (XB - X0) * Math.log(l / 2) / Math.log(SPLIT / 2);
      return XB + (X1 - XB) * (l - SPLIT) / (2500 - SPLIT);
    }
    var LOGY = false;
    // TT and EE are positive and hang from zero; TE swings through zero and
    // needs a signed axis, so each panel carries its own mapping.
    function makeY(p, lo_, hi_) {
      var a = p.y0, b = p.y1;
      if (LOGY && lo_ >= 0) {
        var base = Math.max(hi_ * 1e-5, 1e-3);
        return function (v) {
          var x = Math.max(v, base);
          return b - (b - a) * (Math.log(x / base) / Math.log(hi_ / base));
        };
      }
      return function (v) {
        var t = (v - lo_) / (hi_ - lo_);
        return b - (b - a) * Math.max(-0.03, Math.min(1.03, t));
      };
    }
    function niceSigned(v) {
      var s = [1,2,5];
      var e = Math.floor(Math.log10(Math.max(v, 1e-6)));
      for (var k = 0; k < 40; k++) {
        var m = s[k % 3] * Math.pow(10, e + Math.floor(k / 3));
        if (m >= v * 0.999) return m;
      }
      return v;
    }
    function el(n, at) { var e = document.createElementNS(NS, n), k;
                         for (k in at) e.setAttribute(k, at[k]); return e; }
    function niceMax(v) {
      var steps = [2000, 4000, 6000, 7000, 8000, 10000, 13000, 16000, 20000, 26000];
      for (var i = 0; i < steps.length; i++) if (v <= steps[i] * 0.97) return steps[i];
      return Math.ceil(v / 5000) * 5000;
    }

    // H0 is derived, not chosen: it follows from the two densities and theta*.
    // A quadratic in those three reproduces CAMB to the precision printed in
    // the build log -- the background solve is far smoother than the spectra.
    var H0C = EMU.h0coef, H0P = EMU.h0pow;
    function h0of(p) {
      var z = [2*(p[0]-LO[0])/(HI[0]-LO[0])-1,
               2*(p[1]-LO[1])/(HI[1]-LO[1])-1,
               2*(p[2]-LO[2])/(HI[2]-LO[2])-1];
      var s = 0, i, k, term;
      for (i = 0; i < H0P.length; i++) {
        term = H0C[i];
        for (k = 0; k < 3; k++) term *= Math.pow(z[k], H0P[i][k]);
        s += term;
      }
      return s;
    }

    // Copies, because the forward pass reuses its output buffers.
    var _r = spectra(FID);
    var REF = { TT:Float32Array.from(_r.TT), EE:Float32Array.from(_r.EE),
                TE:Float32Array.from(_r.TE) };

    // Spectrum metadata: how each is labelled, scaled and coloured.
    var SPEC = {
      TT: { label:'TT', axis:'\u2113(\u2113+1)C\u2113/2\u03c0  [\u03bcK\u00b2]', signed:false },
      TE: { label:'TE', axis:'TE  [\u03bcK\u00b2]',                                signed:true  },
      EE: { label:'EE', axis:'EE  [\u03bcK\u00b2]',                                signed:false }
    };

    function draw() {
      layout();
      var S = spectra(cur), i, k;
      var showData = document.getElementById('showdata').checked;
      var showRef  = document.getElementById('showref').checked;

      var old = document.getElementById('plotbody');
      if (old) old.parentNode.removeChild(old);
      var g = el('g', { id:'plotbody' });
      var AX = (SHOWR ? PANELS[PANELS.length-1].r1 : PANELS[PANELS.length-1].y1);

      PANELS.forEach(function (p) {
        var key = p.key, meta = SPEC[key];
        var cur_ = S[key], ref_ = REF[key], pts = PLANCK[key] || [];

        // vertical range: cover model, reference and (if shown) the data
        var vmax = -1e30, vmin = 1e30;
        for (i = 0; i < NL; i++) {
          if (cur_[i] > vmax) vmax = cur_[i];
          if (cur_[i] < vmin) vmin = cur_[i];
          if (showRef) { if (ref_[i] > vmax) vmax = ref_[i]; if (ref_[i] < vmin) vmin = ref_[i]; }
        }
        if (showData) for (i = 0; i < pts.length; i++) {
          if (pts[i][1] + pts[i][3] > vmax) vmax = pts[i][1] + pts[i][3];
          if (pts[i][1] - pts[i][2] < vmin) vmin = pts[i][1] - pts[i][2];
        }
        var lo_, hi_;
        if (meta.signed) { var m = niceSigned(Math.max(Math.abs(vmax), Math.abs(vmin)));
                           lo_ = -m; hi_ = m; }
        else             { hi_ = niceSigned(vmax); lo_ = 0; }
        var fy = makeY(p, lo_, hi_);

        // grid and labels
        var ticks = meta.signed ? [hi_, hi_/2, 0, -hi_/2, -hi_] : [0, hi_/4, hi_/2, 3*hi_/4, hi_];
        ticks.forEach(function (v) {
          g.appendChild(el('line', { x1:X0, x2:X1, y1:fy(v), y2:fy(v),
                                     stroke: v === 0 && meta.signed ? 'var(--ink-faint)' : 'var(--rule)',
                                     'stroke-width':1 }));
          var t = el('text', { x:X0-8, y:fy(v)+4, 'text-anchor':'end', 'font-size':11,
                               fill:'var(--ink-faint)' });
          t.textContent = Math.abs(hi_) < 10 ? v.toFixed(1) : Math.round(v);
          g.appendChild(t);
        });
        g.appendChild(el('rect', { x:X0, y:p.y0, width:X1-X0, height:p.y1-p.y0,
                                   fill:'none', stroke:'var(--ink-faint)', 'stroke-width':1 }));
        g.appendChild(el('line', { x1:XB, x2:XB, y1:p.y0, y2:p.y1, stroke:'var(--rule)',
                                   'stroke-width':1, 'stroke-dasharray':'2 3' }));
        var nm = el('text', { x:X1-8, y:p.y0+16, 'text-anchor':'end', 'font-size':13,
                              fill:'var(--ink-soft)', 'font-weight':'700' });
        nm.textContent = meta.label; g.appendChild(nm);

        // chi-squared for this spectrum, and how far it has moved from Planck,
        // written on the panel itself so the eye does not have to leave the plot.
        var cs_ = chi2of(S, key), dd = cs_.chi - BASECHI[key];
        var dtxt = '\u0394 = ' + (dd >= 0 ? '+' : '\u2212') +
                   (Math.abs(dd) >= 1000 ? Math.round(Math.abs(dd)).toLocaleString()
                                         : Math.abs(dd).toFixed(0));
        var dcol = Math.abs(dd) < 1 ? 'var(--ink-faint)'
                                    : (dd > 0 ? 'var(--scarlet)' : '#1a7f37');
        var ct = el('text', { x:X1-8, y:p.y0+32, 'text-anchor':'end', 'font-size':11.5,
                              fill:'var(--ink-faint)',
                              'font-family':'var(--font-mono)' });
        ct.textContent = '\u03c7\u00b2 ' + Math.round(cs_.chi) + '/' + cs_.n;
        g.appendChild(ct);
        var dt_ = el('text', { x:X1-8, y:p.y0+47, 'text-anchor':'end', 'font-size':12.5,
                               fill:dcol, 'font-weight':'700',
                               'font-family':'var(--font-mono)' });
        dt_.textContent = dtxt; g.appendChild(dt_);
        var yl = el('text', { x:18, y:(p.y0+p.y1)/2, 'text-anchor':'middle', 'font-size':11,
                              fill:'var(--ink-soft)',
                              transform:'rotate(-90 18 ' + ((p.y0+p.y1)/2) + ')' });
        yl.textContent = meta.axis; g.appendChild(yl);

        if (showData) {
          var dg = el('g', { stroke:'var(--ink-soft)', 'stroke-width':1, fill:'none', opacity:.75 });
          for (i = 0; i < pts.length; i++) {
            var q = pts[i], x = xpos(q[0]);
            dg.appendChild(el('line', { x1:x, x2:x, y1:fy(q[1]-q[2]), y2:fy(q[1]+q[3]) }));
            dg.appendChild(el('circle', { cx:x, cy:fy(q[1]), r:1.6, fill:'var(--ink-soft)',
                                          stroke:'none' }));
          }
          g.appendChild(dg);
        }
        function path(arr) {
          var s = '', jj;
          for (jj = 0; jj < NL; jj++)
            s += (jj ? 'L' : 'M') + xpos(NODES[jj]).toFixed(1) + ' ' + fy(arr[jj]).toFixed(1) + ' ';
          return s;
        }
        if (showRef)
          g.appendChild(el('path', { d:path(ref_), fill:'none', stroke:'var(--ink-faint)',
                                     'stroke-width':1.3, 'stroke-dasharray':'5 4' }));
        g.appendChild(el('path', { d:path(cur_), fill:'none', stroke:'var(--scarlet)',
                                   'stroke-width':1.9, 'stroke-linejoin':'round' }));

        // residual strip
        if (SHOWR) {
          var res = [], rmax = 0;
          for (i = 0; i < pts.length; i++) {
            var mv = atL(cur_, pts[i][0]);
            var sg = mv > pts[i][1] ? pts[i][3] : pts[i][2];
            if (!(sg > 0)) continue;
            var rr = (mv - pts[i][1]) / sg;
            res.push([pts[i][0], rr]);
            if (Math.abs(rr) > rmax) rmax = Math.abs(rr);
          }
          var steps = [3,5,10,20,50,100,200,500], RS = 500;
          for (i = 0; i < steps.length; i++) if (rmax <= steps[i]*0.95) { RS = steps[i]; break; }
          var rmid = (p.r0+p.r1)/2, rhalf = (p.r1-p.r0)/2;
          var ry = function (v) { return rmid - rhalf * Math.max(-1, Math.min(1, v/RS)); };
          g.appendChild(el('rect', { x:X0, y:ry(1), width:X1-X0,
                                     height:Math.max(1, ry(-1)-ry(1)),
                                     fill:'var(--ink-faint)', opacity:.13 }));
          g.appendChild(el('line', { x1:X0, x2:X1, y1:rmid, y2:rmid, stroke:'var(--ink-faint)' }));
          g.appendChild(el('rect', { x:X0, y:p.r0, width:X1-X0, height:p.r1-p.r0,
                                     fill:'none', stroke:'var(--ink-faint)' }));
          g.appendChild(el('line', { x1:XB, x2:XB, y1:p.r0, y2:p.r1, stroke:'var(--rule)',
                                     'stroke-dasharray':'2 3' }));
          [RS, -RS].forEach(function (v) {
            var t = el('text', { x:X0-8, y:ry(v)+4, 'text-anchor':'end', 'font-size':10,
                                 fill:'var(--ink-faint)' });
            t.textContent = (v>0?'+':'\u2212') + Math.abs(v); g.appendChild(t);
          });
          var rg = el('g', {});
          for (i = 0; i < res.length; i++) {
            var cl = Math.abs(res[i][1]) > RS;
            rg.appendChild(el('circle', { cx:xpos(res[i][0]), cy:ry(res[i][1]), r:1.6,
                                          fill: cl ? 'var(--scarlet)' : 'var(--ink-soft)',
                                          opacity: cl ? 1 : .8 }));
          }
          g.appendChild(rg);
          var rl = el('text', { x:18, y:rmid, 'text-anchor':'middle', 'font-size':10,
                                fill:'var(--ink-soft)', transform:'rotate(-90 18 ' + rmid + ')' });
          rl.textContent = '(model \u2212 data)/\u03c3'; g.appendChild(rl);
        }
      });

      // one shared multipole axis under the lowest panel
      [2,5,10,30,100,300,600,1000,1500,2000,2500].forEach(function (lv) {
        var x = xpos(lv);
        g.appendChild(el('line', { x1:x, x2:x, y1:AX, y2:AX+5, stroke:'var(--ink-faint)' }));
        var t = el('text', { x:x, y:AX+19, 'text-anchor':'middle', 'font-size':12,
                             fill:'var(--ink-faint)' });
        t.textContent = lv; g.appendChild(t);
      });
      [-4,1].forEach(function (dx) {
        g.appendChild(el('line', { x1:XB+dx-3, x2:XB+dx+3, y1:AX+6, y2:AX-2,
                                   stroke:'var(--ink-faint)', 'stroke-width':1.2 }));
      });
      var lgl = el('text', { x:(X0+XB)/2, y:AX+33, 'text-anchor':'middle', 'font-size':10.5,
                             fill:'var(--ink-faint)', 'font-style':'italic' });
      lgl.textContent = 'logarithmic'; g.appendChild(lgl);
      var lnl = el('text', { x:XB+(X1-XB)*0.12, y:AX+33, 'text-anchor':'middle', 'font-size':10.5,
                             fill:'var(--ink-faint)', 'font-style':'italic' });
      lnl.textContent = 'linear'; g.appendChild(lnl);
      var xl = el('text', { x:(X0+X1)/2, y:AX+33, 'text-anchor':'middle', 'font-size':13,
                            fill:'var(--ink-soft)' });
      xl.setAttribute('x', (X0+X1)/2 + 120); xl.textContent = 'multipole \u2113';
      g.appendChild(xl);
      svg.appendChild(g);

      report(S);
    }

    function chi2of(S, k) {
      var pts = PLANCK[k] || [], c = 0, n = 0, i;
      for (i = 0; i < pts.length; i++) {
        if (k === 'TT' && pts[i][0] < 47) continue;      // TT uses the binned Plik points
        var sg = 0.5 * (pts[i][2] + pts[i][3]);
        if (!(sg > 0)) continue;
        var r = (atL(S[k], pts[i][0]) - pts[i][1]) / sg;
        c += r * r; n++;
      }
      return { chi:c, n:n };
    }
    var BASECHI = { TT:chi2of(REF,'TT').chi, TE:chi2of(REF,'TE').chi, EE:chi2of(REF,'EE').chi };

    // chi-squared and the derived readouts
    function report(S) {
      var H0 = h0of(cur), h = H0/100, omnu = 0.00064;
      var om = (cur[0] + cur[1] + omnu)/(h*h), i;
      // Also repeated beneath the sliders: while dragging, the eye is down here
      // and the panels may well be scrolled out of view. Hidden spectra are
      // greyed but still reported, which is how the tau/A_s contrast stays
      // visible even with only TT plotted.
      var on = activeSpectra(), out = [];
      ['TT','TE','EE'].forEach(function (k) {
        var c = chi2of(S, k), dd = c.chi - BASECHI[k];
        var dcls = Math.abs(dd) < 1 ? 'dnil' : (dd > 0 ? 'dpos' : 'dneg');
        var dtxt = (dd >= 0 ? '+' : '\u2212') +
                   (Math.abs(dd) >= 1000 ? Math.round(Math.abs(dd)).toLocaleString()
                                         : Math.abs(dd).toFixed(0));
        out.push('<span class="' + (on.indexOf(k) < 0 ? 'off' : '') + '">' +
                 '<span class="lab">' + k + '</span> \u03c7\u00b2 ' + Math.round(c.chi) +
                 '/' + c.n + ' <span class="' + dcls + '">\u0394 = ' + dtxt + '</span></span>');
      });
      document.getElementById('chis').innerHTML = out.join('') +
        '<span style="opacity:.55">\u0394 from Planck 2018 &middot; greyed = not plotted</span>';

      // restored: the derived quantities, and the peak readout they sit beside
      document.getElementById('derived').innerHTML =
        '<span>H<sub>0</sub> = <b>' + H0.toFixed(2) + '</b> km/s/Mpc</span>' +
        '<span>\u03a9<sub>m</sub> = <b>' + om.toFixed(4) + '</b></span>' +
        '<span>\u03a9<sub>\u039b</sub> = <b>' + (1 - om).toFixed(4) + '</b></span>' +
        '<span>h = <b>' + h.toFixed(4) + '</b></span>' +
        '<span>A<sub>s</sub>e<sup>\u22122\u03c4</sup> = <b>' +
          (Math.exp(cur[4]) * Math.exp(-2 * cur[3])).toFixed(3) + '\u00d710\u207b\u00b9\u2070</b></span>';

      var pl = 0, pd = 0;
      for (i = 0; i < NL; i++) if (NODES[i] >= 50 && NODES[i] <= 1200 && S.TT[i] > pd) {
        pd = S.TT[i]; pl = NODES[i];
      }
      document.getElementById('peakinfo').textContent =
        'first TT peak near \u2113 = ' + pl + ',  ' + Math.round(pd) + ' \u03bcK\u00b2';
    }

    // ---- controls ---------------------------------------------------------
    var wrap = document.getElementById('knobs');
    PAR.forEach(function (p, i) {
      var d = document.createElement('div'); d.className = 'knob';
      d.innerHTML =
        '<label for="k' + i + '">' + p.html + (p.unit ? ' <span style="font-weight:400;opacity:.7">' +
          p.unit.trim() + '</span>' : '') + '</label>' +
        '<output id="o' + i + '"></output>' +
        '<input type="range" id="k' + i + '" min="' + smin(i) + '" max="' + smax(i) +
          '" step="' + stepFor(i) + '" value="' + FID[i] + '">' +
        '<span class="hint">' + p.hint + '</span>' +
        '<span class="sig"><span>Planck ' + FID[i].toFixed(p.dp) + '</span>' +
          '<span id="d' + i + '"></span></span>';
      wrap.appendChild(d);
      d.querySelector('input').addEventListener('input', function () {
        cur[i] = parseFloat(this.value); sync(); draw();
      });
    });
    function sync() {
      PAR.forEach(function (p, i) {
        document.getElementById('o' + i).innerHTML = cur[i].toFixed(p.dp) +
          ' <span class="pm">&plusmn;' + p.sig + '</span>';
        document.getElementById('k' + i).value = cur[i];
        // How far from Planck, in Planck's own error bars. This is the point of
        // the page that prose alone cannot make: theta*'s slider spans 145 sigma,
        // so a barely visible nudge is already a decisive disagreement.
        var nsig = (cur[i] - FID[i]) / p.sig;
        var cls = Math.abs(nsig) <= 1 ? 'dev--on'
                : (Math.abs(nsig) <= 5 ? 'dev--few' : 'dev--far');
        document.getElementById('d' + i).innerHTML =
          '<b class="' + cls + '">' + (nsig >= 0 ? '+' : '\u2212') +
          Math.abs(nsig).toFixed(Math.abs(nsig) < 10 ? 1 : 0) + '\u03c3</b>';
      });
    }
    document.getElementById('reset').addEventListener('click', function () {
      cur = FID.slice(); sync(); draw();
    });
    // Slide along A_s e^{-2 tau} = constant, which is the direction temperature
    // is nearly blind to. Doing it by hand needs d(lnAs) = 2 d(tau) to three
    // figures, which no one manages with two sliders.
    document.getElementById('degen').addEventListener('click', function () {
      // The largest exactly-compensating step both sliders can take. It has to
      // be exact: clamping one of them breaks d(lnAs) = 2 d(tau) and TT stops
      // being blind to the move, which is the entire point.
      var dt = Math.min(smax(3) - FID[3], (smax(4) - FID[4]) / 2);
      var atDemo = Math.abs(cur[3] - (FID[3] + dt)) < 1e-9 &&
                   Math.abs(cur[4] - (FID[4] + 2*dt)) < 1e-9;
      cur = FID.slice();
      if (!atDemo) {                                   // toggle: A/B against Planck
        cur[3] = FID[3] + dt;
        cur[4] = FID[4] + 2*dt;
        document.getElementById('sp-EE').checked = true;   // invisible without it
      }
      sync(); draw();
    });
    ['sp-TT', 'sp-TE', 'sp-EE'].forEach(function (id) {
      document.getElementById(id).addEventListener('change', draw);
    });
    ['showref', 'showdata', 'showresid'].forEach(function (id) {
      document.getElementById(id).addEventListener('change', draw);
    });
    document.getElementById('logy').addEventListener('change', function () {
      LOGY = this.checked; draw();
    });
    document.getElementById('widerange').addEventListener('change', function () {
      SPAN = this.checked ? Infinity : 10;   // smin/smax clamp to the trained box
      applyRange(); sync(); draw();
    });

    document.getElementById('acc-med').textContent   = EMU.err_med.toFixed(2) + '%';
    document.getElementById('acc-max').textContent   = EMU.err_max.toFixed(2) + '%';
    document.getElementById('acc-ee').textContent    = EMU.ee_med.toFixed(2) + '% median, '
                                                     + EMU.ee_max.toFixed(1) + '% worst';
    document.getElementById('acc-te').textContent    = EMU.te_max.toFixed(1) + ' \u03bcK\u00b2';
    document.getElementById('acc-terms').textContent = EMU.te_rms.toFixed(0) + ' \u03bcK\u00b2';
    sync(); draw();
  })();
  </script>
</body>
</html>
