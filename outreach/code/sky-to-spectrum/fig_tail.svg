<title id="f2t">The Wien tail of a blackbody, and where hydrogen ionisation sits</title>
<desc id="f2d">The blackbody photon number spectrum plotted against photon energy in units of kT on a logarithmic vertical axis, falling by twenty orders of magnitude. The band COBE measured is shaded near the left; the energy needed to ionise hydrogen at recombination lies far out to the right.</desc>
