<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitt Peak — Jim Rohlf</title>
<meta name="description" content="James W. (Jim) Rohlf at the Mayall telescope, Kitt Peak National Observatory: the observatory entrance and the DESI control room.">
<link rel="canonical" href="https://jamesrohlf.github.io/photos.html">
<style>
  :root {
    --bg: #000; --ink: #f2efe9; --muted: #9a948a; --red: #ff2d2d; --rule: #24242a;
    --font: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.55; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  a { color: var(--red); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .back { color: var(--muted); font-size: .9rem; }
  .back:hover { color: var(--red); }
  h1 { font-size: clamp(1.4rem, 1.1rem + 1.2vw, 1.8rem); font-weight: 650; margin: 1rem 0 .25rem; letter-spacing: -0.01em; }
  .subtitle { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; margin: 0 0 2rem; }

  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1.75rem; align-items: start; }
  figure { margin: 0; }
  figure img { width: 100%; height: auto; display: block; border: 1px solid var(--rule); border-radius: 3px; }
  figcaption { color: var(--muted); font-size: .88rem; margin-top: .6rem; }
  figcaption strong { color: var(--ink); font-weight: 600; }
  @media (max-width: 720px) { .pair { grid-template-columns: 1fr; gap: 2.25rem; } }
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="./">&larr; Jim Rohlf</a>

  <h1>Kitt Peak</h1>
  <p class="subtitle">Mayall 4-metre Telescope &middot; Arizona</p>

  <div class="pair">
    <figure>
      <a href="jim-kittpeak-sign.jpg"><img src="jim-kittpeak-sign.jpg"
         alt="James Rohlf beside the Kitt Peak National Observatory welcome sign, which lists the member universities including Boston University"></a>
      <figcaption>
        <strong>The observatory entrance.</strong> The sign lists the member universities
        of the Association of Universities for Research in Astronomy &mdash; Boston
        University among them.
      </figcaption>
    </figure>
    <figure>
      <a href="jim-kittpeak-full.jpg"><img src="jim-kittpeak-full.jpg"
         alt="James Rohlf in the DESI control room, with the focal plane temperature map displayed on the large monitor behind him"></a>
      <figcaption>
        <strong>The DESI control room.</strong> The large monitor shows the focal plane
        temperature map &mdash; all 5,000 robotic fiber positioners, laid out across the
        ten petals, which is how you can tell where the seat is.
      </figcaption>
    </figure>
  </div>

</div>
</body>
</html>
